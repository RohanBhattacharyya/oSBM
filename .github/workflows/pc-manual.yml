name: PC Build (Manual)

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      target:
        description: Which PC platforms to build
        required: true
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
        default: all

permissions:
  contents: read

env:
  # Hash compiler contents rather than mtime so image/toolchain reinstalls
  # can't silently zero the ccache hit rate (see android-manual.yml).
  CCACHE_COMPILERCHECK: content

jobs:
  build_pc:
    name: Build oSBM launcher (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            preset: linux-launcher-release
          - name: linux-arm64
            os: ubuntu-24.04-arm
            preset: linux-arm-launcher-release
          - name: windows
            os: windows-latest
            preset: windows-launcher-release
          - name: macos-x64
            os: macos-15-intel
            preset: macos-launcher-release
          - name: macos-arm64
            os: macos-15
            preset: macos-arm-launcher-release
    steps:
      - name: Skip unselected platform
        id: gate
        shell: bash
        run: |
          target="${{ inputs.target }}"
          name="${{ matrix.name }}"
          run=false
          if [ "$target" = "all" ]; then
            run=true
          elif [ "$target" = "macos" ] && [[ "$name" == macos-* ]]; then
            run=true
          elif [ "$target" = "linux" ] && [[ "$name" == linux-* ]]; then
            run=true
          elif [ "$target" = "$name" ]; then
            run=true
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: steps.gate.outputs.run == 'true' && startsWith(matrix.name, 'linux')
        run: |
          bash scripts/ci/install-linux-deps.sh

      - name: Install ninja (Windows)
        if: steps.gate.outputs.run == 'true' && matrix.name == 'windows'
        run: choco install ninja -y

      - name: Setup MSVC dev environment
        if: steps.gate.outputs.run == 'true' && matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ninja (macOS)
        if: steps.gate.outputs.run == 'true' && startsWith(matrix.name, 'macos')
        run: brew install ninja

      # Compiler cache for the game code itself (vcpkg deps are already
      # binary-cached via run-vcpkg's x-gha source). ccache for gcc/clang;
      # sccache for MSVC, which additionally needs embedded (/Z7) debug info
      # because /Zi's shared PDB writer defeats compile caching.
      - name: Setup compiler cache
        if: steps.gate.outputs.run == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: pc-${{ matrix.name }}
          max-size: 2G
          variant: ${{ matrix.name == 'windows' && 'sccache' || 'ccache' }}

      - name: Setup vcpkg
        if: steps.gate.outputs.run == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "**/source/vcpkg.json"
          vcpkgConfigurationJsonGlob: "**/source/vcpkg-configuration.json"

      - name: Configure
        if: steps.gate.outputs.run == 'true'
        working-directory: source
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows" ]; then
            LAUNCHER_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW"
          else
            LAUNCHER_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake --preset ${{ matrix.preset }} -DVCPKG_INSTALL_OPTIONS=--clean-after-build ${LAUNCHER_FLAGS}

      - name: Build
        if: steps.gate.outputs.run == 'true'
        working-directory: source
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --target starbound core_tests game_tests mobile_controls_tests launcher_support_tests --parallel

      - name: Run asset-free tests
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: ctest --test-dir build/${{ matrix.preset }} -L NoAssets --output-on-failure --timeout 300 --no-tests=error

      - name: Stage artifact
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          echo "OSBM_VERSION=$(tr -d ' \n' < VERSION)" >> "${GITHUB_ENV}"
          mkdir -p pc-staging
          printf '%s\n' "${GITHUB_SHA}" > pc-staging/commit.txt
          test -s dist/starbound${{ matrix.name == 'windows' && '.exe' || '' }}
          cp -v dist/starbound* pc-staging/ 2>/dev/null || true
          cp -v dist/*.dll pc-staging/ 2>/dev/null || true
          cp -v dist/*.dylib pc-staging/ 2>/dev/null || true
          cp -v dist/*.so* pc-staging/ 2>/dev/null || true
          # The desktop build loads its bundled assets from an assets/ folder
          # resolved relative to the executable (exe-adjacent first, then
          # ../assets); without it the launcher opens but the game boot fails
          # with "Error loading asset /rendering/opengl.config". Ship the two
          # distributable asset trees flat alongside the exe. packed.pak is the
          # user's own file and is never bundled.
          mkdir -p pc-staging/assets
          cp -r assets/opensb pc-staging/assets/
          cp -r assets/osbm pc-staging/assets/

      - name: Check packaged assets
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: python3 scripts/ci/check-package.py desktop pc-staging

      - name: Upload artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oSBM-${{ env.OSBM_VERSION }}-pc-launcher-${{ matrix.name }}
          path: pc-staging/*
          if-no-files-found: error
