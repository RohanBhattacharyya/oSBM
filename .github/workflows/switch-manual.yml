name: Switch NRO build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    # Requires the patched SDK and static dependencies documented in
    # docs/agents/build-and-validation.md. Never execute public PRs here.
    if: github.repository == 'RohanBhattacharyya/oSBM' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, osbm-switch]
    timeout-minutes: 90
    concurrency:
      group: switch-toolchain
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          test -n "${DEVKITPRO:-}"
          test -f "${DEVKITPRO}/cmake/Switch.cmake"
          echo "DEVKITA64=${DEVKITPRO}/devkitA64" >> "${GITHUB_ENV}"
          echo "${DEVKITPRO}/tools/bin" >> "${GITHUB_PATH}"
          echo "${DEVKITPRO}/devkitA64/bin" >> "${GITHUB_PATH}"
          "${DEVKITPRO}/devkitA64/bin/aarch64-none-elf-g++" --version
          cmake --version
      - name: Build patched Abseil
        run: bash scripts/switch/build-abseil.sh "${RUNNER_TEMP}/osbm-abseil"
      - name: Configure
        working-directory: source
        run: >-
          cmake --preset switch-release -DSTAR_SWITCH_PACKED_PAK=
          -Dabsl_DIR="${RUNNER_TEMP}/osbm-abseil/install/lib/cmake/absl"
          -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/osbm-abseil/install;${OSBM_SWITCH_PREFIX_PATH:-}"
      - name: Build NRO
        working-directory: source
        # Force relinking when the runner's patched system archives change.
        run: |
          cmake -E rm -f ../dist/starbound.elf
          cmake --build --preset switch-release --target starbound_nro --parallel 2
      - name: Check package
        run: |
          python3 scripts/ci/check-package.py switch build/switch-release/romfs
          test -s build/switch-release/oSBM-*-switch.nro
          printf '%s\n' "${GITHUB_SHA}" > build/switch-release/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oSBM-switch-${{ github.sha }}
          path: |
            build/switch-release/oSBM-*-switch.nro
            build/switch-release/commit.txt
          if-no-files-found: error
