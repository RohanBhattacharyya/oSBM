name: Full platform checks

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    uses: ./.github/workflows/android-manual.yml
    with:
      build_type: Release
      arch: universal
    secrets:
      ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
  ios:
    uses: ./.github/workflows/ios-manual.yml
    with:
      configuration: Release
  desktop:
    uses: ./.github/workflows/pc-manual.yml
    with:
      target: all
